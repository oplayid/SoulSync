name: Build and Publish SoulSync Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Memungkinkan memicu build secara manual dari web GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout kode dari repositori GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup QEMU untuk mendukung build multi-arsitektur (ARM64 & AMD64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Setup Docker Buildx (Engine untuk build multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login ke GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Ekstrak Metadata (Tagging otomatis berdasarkan branch atau versi rilis tag)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # 6. Eksekusi Build dan Push Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Membangun untuk 2 platform sekaligus sesuai dengan kebutuhan Dockerfile Anda
          platforms: linux/amd64,linux/arm64
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          # Menyuplai COMMIT_SHA ke build-args untuk melakukan cache-busting pada layer yt-dlp nightly
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          # Manajemen Cache tercanggih menggunakan cache internal GitHub Actions (gha)
          cache-from: type=gha
          cache-to: type=gha,mode=max
